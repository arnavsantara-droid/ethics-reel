<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
  <meta name="theme-color" content="#050505" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="CFA Doomscroll" />
  <meta name="application-name" content="CFA Doomscroll" />
  <meta name="format-detection" content="telephone=no" />

  <title>CFA Doomscroll</title>

  <!-- iPhone / iPad Add to Home Screen icon -->
  <link rel="apple-touch-icon" href="./app-icon.png?v=20260817-final-1" />
  <link rel="icon" type="image/png" href="./app-icon.png?v=20260817-final-1" />
  <link rel="manifest" href="./manifest.webmanifest?v=20260817-final-1" />

  <style>
    :root{
      --bg:#050505;
      --panel:#151515;
      --panel2:#1d1d1f;
      --line:rgba(255,255,255,.10);
      --text:#f7f7f7;
      --muted:#919196;
      --red:#ff3b3f;
      --red2:#b81721;
      --green:#27d980;
      --green2:#0f8d52;
      --amber:#ffbe3d;
      --shadow:0 24px 60px rgba(0,0,0,.55);
      --radius:28px;
    }

    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text",Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
    body{
      min-height:100dvh;
      background:
        radial-gradient(900px 550px at 105% -10%, rgba(255,59,63,.13), transparent 58%),
        radial-gradient(700px 500px at -12% 98%, rgba(39,217,128,.10), transparent 60%),
        #050505;
      overflow-x:hidden;
    }
    button{font:inherit}
    .app{max-width:760px;margin:0 auto;min-height:100dvh;position:relative}
    .screen{display:none;min-height:100dvh}
    .screen.active{display:block}

    /* HOME */
    .home{padding:calc(22px + env(safe-area-inset-top)) 18px calc(30px + env(safe-area-inset-bottom))}
    .brand-row{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;margin:10px 4px 24px}
    .brand h1{margin:0;font-size:clamp(36px,9vw,58px);line-height:.90;letter-spacing:-2.5px;font-weight:900}
    .brand .doom{background:linear-gradient(180deg,#fff 0%,#cfcfd4 45%,#74747a 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
    .brand p{margin:12px 0 0;color:#8b8b90;font-size:15px;font-weight:650;letter-spacing:.2px}
    .logo-dot{
      width:62px;height:62px;border-radius:20px;
      display:grid;place-items:center;font-weight:1000;font-size:19px;letter-spacing:-1px;
      background:
        radial-gradient(circle at 30% 22%,rgba(255,255,255,.22),transparent 22%),
        linear-gradient(145deg,#242426,#0b0b0c);
      border:1px solid rgba(255,255,255,.13);
      box-shadow:inset 0 1px 0 rgba(255,255,255,.16),0 12px 34px rgba(0,0,0,.65),0 0 24px rgba(255,59,63,.10);
    }

    .glass{
      background:
        linear-gradient(180deg,rgba(255,255,255,.055),rgba(255,255,255,.018)),
        var(--panel);
      border:1px solid rgba(255,255,255,.10);
      box-shadow:inset 0 1px 0 rgba(255,255,255,.08),var(--shadow);
    }

    .today{border-radius:var(--radius);padding:20px;margin-bottom:18px;position:relative;overflow:hidden}
    .today:before{
      content:"";position:absolute;inset:-60% 45% 45% -20%;
      background:radial-gradient(circle,rgba(255,59,63,.13),transparent 62%);
      pointer-events:none
    }
    .section-eyebrow{font-size:12px;font-weight:900;letter-spacing:1.7px;text-transform:uppercase;color:#a8a8ad}
    .today-title{display:flex;justify-content:space-between;align-items:center;margin-top:7px}
    .today-title strong{font-size:26px;letter-spacing:-.9px}
    .today-total{font-size:13px;color:var(--muted);font-weight:750}
    .today-list{margin-top:14px;display:grid;gap:9px}
    .today-row{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:10px 0;border-top:1px solid rgba(255,255,255,.07)}
    .today-row:first-child{border-top:0}
    .today-name{font-weight:800}
    .today-stats{font-size:13px;color:#aaaab0;text-align:right}
    .good{color:var(--green)}
    .bad{color:var(--red)}

    .subjects-label{margin:26px 4px 12px;display:flex;justify-content:space-between;align-items:end}
    .subjects-label h2{margin:0;font-size:20px;letter-spacing:-.5px}
    .subjects-label span{font-size:12px;color:var(--muted);font-weight:700}
    .subjects{display:grid;gap:12px}
    .subject{
      width:100%;border:0;color:var(--text);text-align:left;cursor:pointer;
      border-radius:24px;padding:18px 18px 17px;position:relative;overflow:hidden;
      background:
        radial-gradient(220px 100px at 85% -30%,var(--accentGlow),transparent 68%),
        linear-gradient(145deg,#202022 0%,#121213 54%,#0d0d0e 100%);
      border:1px solid rgba(255,255,255,.105);
      box-shadow:inset 0 1px 0 rgba(255,255,255,.11),inset 0 -1px 0 rgba(0,0,0,.55),0 13px 34px rgba(0,0,0,.44);
      transition:transform .12s ease,filter .12s ease;
    }
    .subject:active{transform:translateY(2px) scale(.995);filter:brightness(.94)}
    .subject-top{display:flex;justify-content:space-between;align-items:center;gap:12px}
    .subject-name{font-size:18px;font-weight:900;letter-spacing:-.35px}
    .subject-arrow{width:34px;height:34px;border-radius:13px;display:grid;place-items:center;background:linear-gradient(145deg,rgba(255,255,255,.12),rgba(255,255,255,.035));border:1px solid rgba(255,255,255,.08);box-shadow:inset 0 1px 0 rgba(255,255,255,.08)}
    .subject-meta{margin-top:7px;color:#8f8f95;font-size:12px;font-weight:700}
    .subject .bar{height:4px;background:#262629;border-radius:999px;margin-top:14px;overflow:hidden}
    .subject .bar > i{display:block;height:100%;width:var(--progress,0%);border-radius:inherit;background:linear-gradient(90deg,var(--accent),rgba(255,255,255,.72));box-shadow:0 0 13px var(--accentGlow)}
    .subject[data-color="red"]{--accent:#ff3b3f;--accentGlow:rgba(255,59,63,.23)}
    .subject[data-color="green"]{--accent:#26d980;--accentGlow:rgba(38,217,128,.20)}
    .subject[data-color="amber"]{--accent:#ffbd3d;--accentGlow:rgba(255,189,61,.18)}
    .subject[data-color="violet"]{--accent:#9f7cff;--accentGlow:rgba(159,124,255,.18)}

    /* QUIZ */
    .quiz{min-height:100dvh;padding-bottom:calc(112px + env(safe-area-inset-bottom))}
    .quiz-head{
      position:sticky;top:0;z-index:10;
      padding:calc(12px + env(safe-area-inset-top)) 18px 13px;
      background:linear-gradient(180deg,rgba(5,5,5,.98),rgba(5,5,5,.92));
      border-bottom:1px solid rgba(255,255,255,.08);
      backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    }
    .head-top{display:flex;align-items:center;justify-content:space-between;gap:12px}
    .back{
      appearance:none;border:0;color:#fff;background:transparent;padding:5px 0;
      font-size:15px;font-weight:850;cursor:pointer;display:flex;align-items:center;gap:7px
    }
    .subject-title{font-size:13px;text-transform:uppercase;letter-spacing:1.25px;font-weight:950;color:#d5d5d9}
    .mini-score{font-size:12px;color:#8e8e93;font-weight:800;white-space:nowrap}
    .head-metrics{
      display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;margin-top:12px;
    }
    .metric{
      font-size:12px;font-weight:950;letter-spacing:1.35px;text-transform:uppercase;color:#babac0;
      white-space:nowrap
    }
    .metric:last-child{text-align:right}
    .timer{
      min-width:77px;text-align:center;border-radius:14px;padding:7px 10px;
      font-variant-numeric:tabular-nums;font-size:15px;font-weight:1000;letter-spacing:.6px;color:#fff;
      background:linear-gradient(180deg,#ff4b50,#b81721);
      border:1px solid rgba(255,255,255,.17);
      box-shadow:inset 0 1px 0 rgba(255,255,255,.26),0 8px 22px rgba(255,59,63,.22);
    }
    .timer.warning{animation:pulse .9s infinite alternate}
    @keyframes pulse{to{filter:brightness(1.18);box-shadow:inset 0 1px 0 rgba(255,255,255,.28),0 0 24px rgba(255,59,63,.42)}}

    .quiz-body{padding:26px 18px 30px}
    .difficulty{display:inline-flex;padding:7px 10px;border-radius:11px;background:#19191b;border:1px solid rgba(255,255,255,.08);font-size:10px;letter-spacing:1.3px;font-weight:950;color:#a9a9ae}
    .stem{font-size:clamp(21px,5.4vw,29px);line-height:1.38;letter-spacing:-.5px;font-weight:830;margin:16px 0 22px}

    .answers{display:grid;gap:13px}
    .answer{
      width:100%;border:0;color:#f3f3f4;text-align:left;cursor:pointer;
      display:grid;grid-template-columns:42px 1fr;gap:13px;align-items:start;
      padding:17px 16px;border-radius:22px;
      background:
        linear-gradient(145deg,rgba(255,255,255,.055),rgba(255,255,255,.012)),
        #171719;
      border:1px solid rgba(255,255,255,.115);
      box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 12px 28px rgba(0,0,0,.30);
      transition:transform .11s ease,border-color .16s ease,background .16s ease,box-shadow .16s ease;
    }
    .answer:active:not(:disabled){transform:translateY(2px) scale(.995)}
    .answer:disabled{cursor:default}
    .letter{
      width:38px;height:38px;border-radius:14px;display:grid;place-items:center;font-weight:1000;font-size:15px;
      background:linear-gradient(145deg,#29292c,#121214);border:1px solid rgba(255,255,255,.10);
      box-shadow:inset 0 1px 0 rgba(255,255,255,.10),0 7px 14px rgba(0,0,0,.33);
    }
    .answer-text{font-size:17px;line-height:1.42;padding-top:5px;font-weight:620}
    .answer.correct{
      background:linear-gradient(145deg,rgba(39,217,128,.24),rgba(15,141,82,.11)),#121a16;
      border-color:rgba(39,217,128,.75);
      box-shadow:inset 0 1px 0 rgba(255,255,255,.09),0 0 0 1px rgba(39,217,128,.12),0 14px 32px rgba(39,217,128,.13)
    }
    .answer.correct .letter{background:linear-gradient(180deg,#39e58e,#0f8d52);border-color:rgba(255,255,255,.16)}
    .answer.wrong{
      background:linear-gradient(145deg,rgba(255,59,63,.24),rgba(184,23,33,.11)),#1a1112;
      border-color:rgba(255,59,63,.76);
      box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 0 0 1px rgba(255,59,63,.10),0 14px 32px rgba(255,59,63,.13)
    }
    .answer.wrong .letter{background:linear-gradient(180deg,#ff5155,#b81721);border-color:rgba(255,255,255,.16)}

    .explanation{
      display:none;margin-top:20px;border-radius:24px;padding:18px;
      background:linear-gradient(150deg,#202022,#111112);
      border:1px solid rgba(255,255,255,.10);
      box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 15px 32px rgba(0,0,0,.36)
    }
    .explanation.show{display:block}
    .explanation h3{font-size:13px;letter-spacing:1.3px;text-transform:uppercase;margin:0 0 10px;color:#bdbdc2}
    .explanation p{margin:0;color:#dddddf;font-size:15px;line-height:1.55}
    .source{display:inline-block;margin-top:13px;color:#a9a9ae;font-size:12px;text-decoration:none;border-bottom:1px solid #555}

    .bottom{
      position:fixed;z-index:20;left:50%;transform:translateX(-50%);bottom:0;width:min(760px,100%);
      padding:12px 18px calc(12px + env(safe-area-inset-bottom));
      background:linear-gradient(180deg,rgba(5,5,5,.70),rgba(5,5,5,.99) 25%);
      backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
      border-top:1px solid rgba(255,255,255,.075);
    }
    .bottom-row{display:flex;align-items:center;justify-content:space-between;gap:12px}
    .score-pills{display:flex;gap:13px;align-items:center;font-size:13px;font-weight:900;color:#9a9aa0;white-space:nowrap}
    .next{
      border:1px solid rgba(255,255,255,.14);border-radius:18px;padding:15px 18px;color:#fff;font-weight:1000;letter-spacing:.4px;cursor:pointer;
      background:linear-gradient(180deg,#ff4d52,#b81721);
      box-shadow:inset 0 1px 0 rgba(255,255,255,.26),0 10px 26px rgba(255,59,63,.22);
      transition:transform .12s ease,opacity .15s ease;
    }
    .next:active:not(:disabled){transform:translateY(2px)}
    .next:disabled{opacity:.28;cursor:default;box-shadow:none}

    .empty{
      margin:40px 18px;padding:24px;border-radius:25px;
      background:#151517;border:1px solid rgba(255,255,255,.09);
      box-shadow:var(--shadow)
    }
    .empty h2{margin:0 0 9px;font-size:23px}
    .empty p{color:#aaaab0;line-height:1.5}
    .empty code{color:#fff}
    .empty button{margin-top:12px}

    @media (min-width:620px){
      .home{padding-left:28px;padding-right:28px}
      .quiz-body{padding-left:28px;padding-right:28px}
      .quiz-head{padding-left:28px;padding-right:28px}
      .bottom{padding-left:28px;padding-right:28px}
      .subjects{grid-template-columns:1fr 1fr}
    }
  </style>
</head>
<body>
<div class="app">
  <section id="homeScreen" class="screen active home">
    <div class="brand-row">
      <div class="brand">
        <h1>CFA<br><span class="doom">DOOMSCROLL</span></h1>
        <p>One hard question instead of one useless scroll.</p>
      </div>
      <div class="logo-dot">CFA</div>
    </div>

    <div class="today glass">
      <div class="section-eyebrow">Questions Today</div>
      <div class="today-title">
        <strong id="todayHeadline">0 attempted</strong>
        <span id="todayTotal" class="today-total">0 correct · 0 wrong</span>
      </div>
      <div id="todayList" class="today-list">
        <div style="color:#85858a;font-size:13px;margin-top:7px">No questions attempted yet today.</div>
      </div>
    </div>

    <div class="subjects-label">
      <h2>Subjects</h2>
      <span>2027 Level I</span>
    </div>
    <div id="subjects" class="subjects"></div>
  </section>

  <section id="quizScreen" class="screen quiz">
    <header class="quiz-head">
      <div class="head-top">
        <button class="back" id="backBtn" aria-label="Back to subjects">‹ <span id="quizSubject">ETHICS</span></button>
        <div class="mini-score" id="miniScore">✓ 0 · × 0</div>
      </div>
      <div class="head-metrics">
        <div class="metric" id="questionNumber">QUESTION 1</div>
        <div class="timer" id="timer">01:00</div>
        <div class="metric" id="bankCount">0 QUESTIONS</div>
      </div>
    </header>

    <main id="quizBody" class="quiz-body">
      <span class="difficulty" id="difficulty">BRUTAL</span>
      <div class="stem" id="stem"></div>
      <div id="answers" class="answers"></div>

      <div id="explanation" class="explanation">
        <h3>Why</h3>
        <p id="explanationText"></p>
        <a id="sourceLink" class="source" target="_blank" rel="noopener">Official source ↗</a>
      </div>
    </main>

    <div id="emptyState" class="empty" style="display:none">
      <h2>Bank file not found</h2>
      <p id="emptyText"></p>
      <button class="next" id="emptyBack">BACK</button>
    </div>

    <footer class="bottom" id="bottomBar">
      <div class="bottom-row">
        <div class="score-pills">
          <span>🔥 <b id="streak">0</b></span>
          <span class="good">✓ <b id="correct">0</b></span>
          <span class="bad">× <b id="wrong">0</b></span>
        </div>
        <button id="nextBtn" class="next" disabled>NEXT QUESTION →</button>
      </div>
    </footer>
  </section>
</div>

<script>
/*
  CFA DOOMSCROLL — final shell
  ------------------------------------------------------
  Current legacy Ethics bank support:
    questions.js -> window.QUESTIONS = [ ... ];

  Optional modern format for any subject:
    window.CFA_BANKS = window.CFA_BANKS || {};
    window.CFA_BANKS.equity = [ ... ];

  The loader below also tries common file names automatically.
*/

const BUILD = "20260817-fsa-equity-integrated-1";
const SUBJECTS = [
  {key:"ethics", name:"Ethics", color:"red", files:["questions.js","questions-ethics.js","ethics.js"]},
  {key:"quant", name:"Quantitative Methods", color:"green", files:["questions-quant.js","quant.js","quantitative-methods.js"]},
  {key:"economics", name:"Economics", color:"amber", files:["questions-economics.js","economics.js"]},
  {key:"fsa", name:"Financial Statement Analysis", color:"violet", knownCount:100, files:["FSA_100_QUESTIONS_q201-q300.json","questions-fsa.js","fsa.js","financial-statement-analysis.js"]},
  {key:"corporate", name:"Corporate Issuers", color:"red", files:["questions-corporate.js","corporate.js","corporate-issuers.js"]},
  {key:"equity", name:"Equity Investments", color:"green", knownCount:100, files:["EQUITY_100_QUESTIONS_q301-q400.json","questions-equity.js","equity.js"]},
  {key:"fixedincome", name:"Fixed Income", color:"amber", files:["questions-fixed-income.js","fixed-income.js","fixedincome.js"]},
  {key:"derivatives", name:"Derivatives", color:"violet", files:["questions-derivatives.js","derivatives.js"]},
  {key:"alternatives", name:"Alternative Investments", color:"red", files:["questions-alternatives.js","alternatives.js","alternative-investments.js"]},
  {key:"portfolio", name:"Portfolio Management", color:"green", files:["questions-portfolio.js","portfolio.js","portfolio-management.js"]}
];

const els = {
  home: document.getElementById("homeScreen"),
  quiz: document.getElementById("quizScreen"),
  subjects: document.getElementById("subjects"),
  todayHeadline: document.getElementById("todayHeadline"),
  todayTotal: document.getElementById("todayTotal"),
  todayList: document.getElementById("todayList"),
  quizSubject: document.getElementById("quizSubject"),
  miniScore: document.getElementById("miniScore"),
  qNum: document.getElementById("questionNumber"),
  timer: document.getElementById("timer"),
  bankCount: document.getElementById("bankCount"),
  difficulty: document.getElementById("difficulty"),
  stem: document.getElementById("stem"),
  answers: document.getElementById("answers"),
  explanation: document.getElementById("explanation"),
  explanationText: document.getElementById("explanationText"),
  sourceLink: document.getElementById("sourceLink"),
  next: document.getElementById("nextBtn"),
  streak: document.getElementById("streak"),
  correct: document.getElementById("correct"),
  wrong: document.getElementById("wrong"),
  back: document.getElementById("backBtn"),
  empty: document.getElementById("emptyState"),
  emptyText: document.getElementById("emptyText"),
  emptyBack: document.getElementById("emptyBack"),
  quizBody: document.getElementById("quizBody"),
  bottomBar: document.getElementById("bottomBar")
};

const runtimeBanks = {};
let activeSubject = null;
let bank = [];
let bankIndex = 0;            // hidden permanent position in that subject bank
let visibleSessionNo = 1;     // ALWAYS starts at 1 after a page refresh / subject open
let timerId = null;
let seconds = 60;
let answered = false;

function dayKey(){
  const d = new Date();
  const y = d.getFullYear();
  const m = String(d.getMonth()+1).padStart(2,"0");
  const day = String(d.getDate()).padStart(2,"0");
  return `${y}-${m}-${day}`;
}
function getJSON(key, fallback){
  try { return JSON.parse(localStorage.getItem(key)) ?? fallback; }
  catch { return fallback; }
}
function setJSON(key, value){ localStorage.setItem(key, JSON.stringify(value)); }

function progressKey(subjectKey){ return `doomscroll.progress.${subjectKey}`; }
function scoreKey(subjectKey){ return `doomscroll.score.${subjectKey}`; }
function todayKey(){ return `doomscroll.today.${dayKey()}`; }

function getScore(key){
  return getJSON(scoreKey(key), {correct:0, wrong:0, streak:0});
}
function getProgress(key){
  return getJSON(progressKey(key), {nextIndex:0});
}
function updateScoreUI(){
  const s = getScore(activeSubject.key);
  els.correct.textContent = s.correct;
  els.wrong.textContent = s.wrong;
  els.streak.textContent = s.streak;
  els.miniScore.textContent = `✓ ${s.correct} · × ${s.wrong}`;
}

function recordToday(subject, wasCorrect){
  const all = getJSON(todayKey(), {});
  const row = all[subject.key] || {name:subject.name, attempted:0, correct:0, wrong:0};
  row.attempted += 1;
  if (wasCorrect) row.correct += 1; else row.wrong += 1;
  all[subject.key] = row;
  setJSON(todayKey(), all);
  renderToday();
}

function renderToday(){
  const all = getJSON(todayKey(), {});
  const rows = Object.values(all).filter(x => x.attempted > 0);
  const total = rows.reduce((a,x)=>a+x.attempted,0);
  const c = rows.reduce((a,x)=>a+x.correct,0);
  const w = rows.reduce((a,x)=>a+x.wrong,0);

  els.todayHeadline.textContent = `${total} attempted`;
  els.todayTotal.innerHTML = `<span class="good">${c} correct</span> · <span class="bad">${w} wrong</span>`;

  if (!rows.length){
    els.todayList.innerHTML = `<div style="color:#85858a;font-size:13px;margin-top:7px">No questions attempted yet today.</div>`;
    return;
  }
  els.todayList.innerHTML = rows.map(r => `
    <div class="today-row">
      <div class="today-name">${escapeHTML(r.name)}</div>
      <div class="today-stats">${r.attempted} questions — <span class="good">${r.correct} correct</span>, <span class="bad">${r.wrong} wrong</span></div>
    </div>
  `).join("");
}

function escapeHTML(s=""){
  return String(s).replace(/[&<>"']/g, ch => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"
  }[ch]));
}

function renderSubjects(){
  els.subjects.innerHTML = SUBJECTS.map((s,i) => {
    const p = getProgress(s.key);
    const knownBank = runtimeBanks[s.key];
    let meta = "Tap to start";
    let progress = 0;
    if (knownBank?.length){
      progress = Math.min(100, (p.nextIndex / knownBank.length) * 100);
      meta = `${knownBank.length} questions · ${Math.min(p.nextIndex, knownBank.length)} completed`;
    } else if (s.knownCount) {
      meta = `${s.knownCount} questions · production bank`;
    } else if (s.key === "ethics") {
      meta = "Production bank";
    }
    return `
      <button class="subject" data-key="${s.key}" data-color="${s.color}" style="--progress:${progress}%">
        <div class="subject-top">
          <div class="subject-name">${escapeHTML(s.name)}</div>
          <div class="subject-arrow">›</div>
        </div>
        <div class="subject-meta">${escapeHTML(meta)}</div>
        <div class="bar"><i></i></div>
      </button>
    `;
  }).join("");

  els.subjects.querySelectorAll(".subject").forEach(btn => {
    btn.addEventListener("click", () => startSubject(btn.dataset.key));
  });
}

function loadScript(src){
  return new Promise((resolve,reject)=>{
    const script = document.createElement("script");
    script.src = `${src}?v=${BUILD}`;
    script.async = true;
    script.onload = () => resolve(src);
    script.onerror = () => { script.remove(); reject(new Error(src)); };
    document.head.appendChild(script);
  });
}

async function loadJSON(src){
  const response = await fetch(`${src}?v=${BUILD}`, {cache:"no-store"});
  if (!response.ok) throw new Error(src);
  const data = await response.json();
  if (Array.isArray(data)) return data;
  if (data && Array.isArray(data.questions)) return data.questions;
  throw new Error(`No questions array in ${src}`);
}

async function loadBank(subject){
  if (runtimeBanks[subject.key]) return runtimeBanks[subject.key];

  window.CFA_BANKS = window.CFA_BANKS || {};

  // If a bank was already registered by another script, use it.
  if (Array.isArray(window.CFA_BANKS[subject.key]) && window.CFA_BANKS[subject.key].length){
    runtimeBanks[subject.key] = window.CFA_BANKS[subject.key];
    return runtimeBanks[subject.key];
  }

  // Try the canonical production JSON first, then fall back to legacy JS filenames.
  for (const file of subject.files){
    try{
      let found = null;

      if (file.toLowerCase().endsWith(".json")){
        found = await loadJSON(file);
      } else {
        // Legacy JS banks may export window.QUESTIONS.
        window.QUESTIONS = undefined;
        await loadScript(file);

        if (Array.isArray(window.CFA_BANKS[subject.key]) && window.CFA_BANKS[subject.key].length){
          found = window.CFA_BANKS[subject.key];
        } else if (Array.isArray(window.QUESTIONS) && window.QUESTIONS.length){
          found = window.QUESTIONS;
        }
      }

      if (Array.isArray(found) && found.length){
        // Enforce subject separation for structured banks.
        const normalized = found.filter(q => !q.subject || String(q.subject).toLowerCase() === subject.key ||
          (subject.key === "fsa" && String(q.subject).toLowerCase() === "fsa") ||
          (subject.key === "equity" && String(q.subject).toLowerCase() === "equity"));

        runtimeBanks[subject.key] = normalized.length ? normalized : found;
        return runtimeBanks[subject.key];
      }
    }catch(e){}
  }

  throw new Error("BANK_NOT_FOUND");
}

async function startSubject(key){
  activeSubject = SUBJECTS.find(s => s.key === key);
  if (!activeSubject) return;

  // Crucial refresh behavior:
  // visible numbering restarts from 1 every time the page/session starts.
  // hidden bank progress remains separate and continues from the next unseen item.
  visibleSessionNo = 1;
  answered = false;
  stopTimer();

  els.home.classList.remove("active");
  els.quiz.classList.add("active");
  els.quizSubject.textContent = activeSubject.name.toUpperCase();
  els.quizBody.style.display = "block";
  els.bottomBar.style.display = "block";
  els.empty.style.display = "none";
  els.stem.textContent = "Loading question bank…";
  els.answers.innerHTML = "";
  els.explanation.classList.remove("show");
  els.bankCount.textContent = "… QUESTIONS";
  els.qNum.textContent = "QUESTION 1";

  try{
    bank = await loadBank(activeSubject);
    if (!bank.length) throw new Error("BANK_NOT_FOUND");

    const p = getProgress(activeSubject.key);
    bankIndex = Number.isInteger(p.nextIndex) ? p.nextIndex : 0;
    if (bankIndex >= bank.length) bankIndex = 0;

    renderQuestion();
    renderSubjects();
  }catch(e){
    showMissingBank();
  }
}

function showMissingBank(){
  stopTimer();
  els.quizBody.style.display = "none";
  els.bottomBar.style.display = "none";
  els.empty.style.display = "block";
  const expected = activeSubject.files.map(f=>`<code>${escapeHTML(f)}</code>`).join(", ");
  els.emptyText.innerHTML =
    `The app shell is working, but no ${escapeHTML(activeSubject.name)} question file exists in the site yet. ` +
    `Add one of these supported bank files to the same GitHub Pages folder: ${expected}. ` +
    `The app will detect it automatically — no UI code change is needed.`;
}

function renderQuestion(){
  const q = bank[bankIndex];
  if (!q) return;

  answered = false;
  seconds = 60;
  els.qNum.textContent = `QUESTION ${visibleSessionNo}`;
  els.bankCount.textContent = `${bank.length} QUESTIONS`;
  els.difficulty.textContent = String(q.difficulty || "HARD").toUpperCase();
  els.stem.textContent = q.stem || "";
  els.explanation.classList.remove("show");
  els.explanationText.textContent = "";
  els.sourceLink.style.display = q.source ? "inline-block" : "none";
  if (q.source) els.sourceLink.href = q.source;
  els.next.disabled = true;

  els.answers.innerHTML = (q.options || []).map((opt, i)=>`
    <button class="answer" data-index="${i}">
      <span class="letter">${String.fromCharCode(65+i)}</span>
      <span class="answer-text">${escapeHTML(opt)}</span>
    </button>
  `).join("");

  els.answers.querySelectorAll(".answer").forEach(btn=>{
    btn.addEventListener("click",()=>answerQuestion(Number(btn.dataset.index)));
  });

  updateScoreUI();
  window.scrollTo({top:0,behavior:"instant"});
  startTimer();
}

function startTimer(){
  stopTimer();
  seconds = 60;
  updateTimer();
  timerId = setInterval(()=>{
    seconds -= 1;
    updateTimer();
    if (seconds <= 0){
      stopTimer();
      if (!answered) answerQuestion(-1);
    }
  },1000);
}
function stopTimer(){
  if (timerId){ clearInterval(timerId); timerId = null; }
}
function updateTimer(){
  els.timer.textContent = `00:${String(Math.max(0,seconds)).padStart(2,"0")}`;
  els.timer.classList.toggle("warning", seconds <= 10);
}

function answerQuestion(chosen){
  if (answered) return;
  answered = true;
  stopTimer();

  const q = bank[bankIndex];
  const correctIndex = Number(q.correct);
  const wasCorrect = chosen === correctIndex;
  const buttons = [...els.answers.querySelectorAll(".answer")];

  buttons.forEach((b,i)=>{
    b.disabled = true;
    if (i === correctIndex) b.classList.add("correct");
    if (i === chosen && i !== correctIndex) b.classList.add("wrong");
  });

  const s = getScore(activeSubject.key);
  if (wasCorrect){
    s.correct += 1;
    s.streak += 1;
  } else {
    s.wrong += 1;
    s.streak = 0;
  }
  setJSON(scoreKey(activeSubject.key), s);
  recordToday(activeSubject, wasCorrect);

  // Move the HIDDEN permanent bank pointer now.
  // That means a refresh after answering continues to the next unseen item,
  // while the VISIBLE label still restarts at QUESTION 1.
  const nextHidden = Math.min(bankIndex + 1, bank.length);
  setJSON(progressKey(activeSubject.key), {nextIndex: nextHidden});

  els.explanationText.textContent = q.explanation || "No explanation supplied.";
  els.explanation.classList.add("show");
  els.next.disabled = false;
  updateScoreUI();
  renderSubjects();
}

function nextQuestion(){
  if (!answered) return;

  const p = getProgress(activeSubject.key);
  bankIndex = p.nextIndex;

  if (bankIndex >= bank.length){
    // End of bank: restart from the first item only after the full bank has been consumed.
    bankIndex = 0;
    setJSON(progressKey(activeSubject.key), {nextIndex:0});
  }

  visibleSessionNo += 1;
  renderQuestion();
}

function goHome(){
  stopTimer();
  els.quiz.classList.remove("active");
  els.home.classList.add("active");
  renderToday();
  renderSubjects();
  window.scrollTo({top:0,behavior:"instant"});
}

els.next.addEventListener("click", nextQuestion);
els.back.addEventListener("click", goHome);
els.emptyBack.addEventListener("click", goHome);

renderToday();
renderSubjects();
</script>
</body>
</html>
